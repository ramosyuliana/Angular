<section class="formulario fade-in">
    <div class="tarjeta-form">

        <div class="encabezado">
            <div>
                <h2>{{ editando ? 'Editar Producto Existente' : 'Registrar Nuevo Producto' }}</h2>
                <p>Completa los campos para actualizar el inventario veterinario.</p>
            </div>
            <a routerLink="/productos" class="cerrar"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <form (ngSubmit)="MtGuardar()" class="cuerpo">

            <div class="campo">
                <label>Nombre del Producto *</label>
                <div class="con-icono">
                    <i class="fa-solid fa-tag"></i>
                    <input name="nombre" [(ngModel)]="producto.nombre" required
                        placeholder="Ej. Alimento Premium Perro Adulto 15kg">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Precio ($) *</label>
                    <div class="con-icono">
                        <i class="fa-solid fa-dollar-sign"></i>
                        <input name="precio" type="number" min="0" step="0.01" [(ngModel)]="producto.precio" required
                            placeholder="45000">
                    </div>
                </div>
                <div class="campo">
                    <label>Cantidad Disponible *</label>
                    <div class="con-icono">
                        <i class="fa-solid fa-cubes"></i>
                        <input name="cantidad" type="number" min="0" [(ngModel)]="producto.cantidad" required
                            placeholder="12">
                    </div>
                </div>
            </div>

            <div class="campo">
                <label>Imagen (URL)</label>
                <div class="con-icono">
                    <i class="fa-solid fa-image"></i>
                    <input name="imagen" type="url" [(ngModel)]="producto.imagen"
                        placeholder="https://ejemplo.com/imagen.jpg (opcional)">
                </div>
                <small>Si se deja en blanco, se mostrará una imagen predeterminada.</small>
                @if (producto.imagen) {
                <img class="preview" [src]="producto.imagen" alt="Vista previa">
                }
            </div>

            <div class="campo">
                <label>Descripción Detallada *</label>
                <textarea name="descripcion" rows="3" [(ngModel)]="producto.descripcion" required
                    placeholder="Ingredientes, indicaciones, propósito veterinario..."></textarea>
            </div>

            <div class="botones">
                <a routerLink="/productos" class="boton boton-secundario">Cancelar</a>
                <button type="submit" class="boton boton-primario">
                    {{ editando ? 'Actualizar Cambios' : 'Guardar Producto' }}
                </button>
            </div>
        </form>
    </div>
</section>
