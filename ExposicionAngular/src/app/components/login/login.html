<div class="tarjeta">

    <div class="encabezado">
        <div class="logo"><i class="fa-solid fa-paw"></i></div>
        <h1>Patitas Felices</h1>
        <p>Ingresa a tu cuenta para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>

        <div>
            <label for="email">Correo Electrónico</label>
            <div class="campo">
                <span class="icono"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="email" formControlName="email"
                       autocomplete="email" placeholder="ejemplo@correo.com">
            </div>
            @if (form.controls.email.touched && form.controls.email.invalid) {
                <small>Ingresa un correo válido</small>
            }
        </div>

        <div>
            <label for="password">Contraseña</label>
            <div class="campo">
                <span class="icono"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="password" formControlName="password"
                       autocomplete="current-password" placeholder="••••••••">
            </div>
            @if (form.controls.password.touched && form.controls.password.invalid) {
                <small>Mínimo 8 caracteres</small>
            }
        </div>

        @if (error()) {
            <p class="error">{{ error() }}</p>
        }

        <button type="submit" [disabled]="cargando()" class="boton">
            {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>
    </form>

</div>
